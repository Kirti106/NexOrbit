
services:
  postgres:
    image: postgis/postgis:16-3.7
    container_name: nexorbit_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexorbit}
      POSTGRES_USER: ${POSTGRES_USER:-nexorbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

    ports:
      - "5432:5432"

    volumes:
      - nexorbit_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d:ro
      - ./ml/db/migrations:/migrations:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT to_regclass('public.satellites') IS NOT NULL AND
          to_regclass('public.gp_history') IS NOT NULL AND
          to_regclass('public.conjunctions') IS NOT NULL" | grep -qx t
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dataset_loader:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: nexorbit_dataset_loader
    command: ["python", "-m", "src.seed_samples"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nexorbit}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-nexorbit}
    volumes:
      - ./ml/data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  ml_api:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: nexorbit_ml_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nexorbit}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-nexorbit}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8001:8001"
    depends_on:
      dataset_loader:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexorbit_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexorbit}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-nexorbit}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ML_API_URL: http://ml_api:8001
    ports:
      - "8000:8000"
    depends_on:
      dataset_loader:
        condition: service_completed_successfully

volumes:
  nexorbit_data:
